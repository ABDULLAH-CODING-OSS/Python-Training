{% extends 'inventory/base.html' %}
{% load i18n %}
{%load crispy_forms_tags%}

{% block content %}
<div class ="row">
    <div class ="col-11 col-md-4 mx-auto mt-5">
        <h1>{% trans "LOG IN" %}</h1>
            <form method="post">
                {% csrf_token%}
                {{form|crispy}}
                <button class ="btn btn-outline-primary"> {% trans "Sign In" %}</button>
            </form>
            <div class = "pt-3">
                <small class = "text-muted"> {% trans "Need an account?" %} <a href ="{% url 'signup' %}">{% trans "Sign up" %}</a></small>
            </div>
        </div>
    </div>
</div>
{%endblock content%}
